# 로컬 개발용 PostgreSQL.
#
#   docker compose up -d      띄우기
#   docker compose down       내리기 (데이터는 볼륨에 남습니다)
#   docker compose down -v    데이터까지 삭제
#
# 여기 적힌 계정은 로컬 개발 전용입니다. 운영 값은 .env 로 주입합니다.
services:
  db:
    image: postgres:16
    container_name: closr-db
    environment:
      POSTGRES_USER: closr
      POSTGRES_PASSWORD: closr1234
      POSTGRES_DB: closr
    ports:
      - "5432:5432"
    volumes:
      - closr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closr -d closr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  closr-pgdata:
