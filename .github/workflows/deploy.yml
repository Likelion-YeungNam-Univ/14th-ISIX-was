name: Deploy Spring Boot to AWS EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop
      - main

# PR에 댓글을 남기기 위한 깃허브 보트 권한 설정
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 테스트가 컨텍스트를 띄우려면 DB 가 필요합니다.
    # measurements 가 jsonb 라 H2 로 대체할 수 없어 실제 PostgreSQL 을 씁니다.
    # 접속 정보는 local 프로필 기본값과 맞춰 둡니다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: closr
          POSTGRES_PASSWORD: closr1234
          POSTGRES_DB: closr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드 및 테스트
        run: ./gradlew build

      # 아래 배포 스텝들은 main에 실제로 머지된 코드(push)에서만 실행됩니다.
      # PR에서는 위의 빌드까지만 수행합니다.
      # main 이 배포 브랜치입니다. develop 은 개발 통합 브랜치로, 검증이 끝나면
      # develop -> main PR 로 올리고 그 머지가 배포를 일으킵니다.
      - name: JAR 파일 EC2로 전송
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*.jar"
          target: "~/deploy"
          strip_components: 2

      - name: systemd 서비스 유닛 등록
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo tee /etc/systemd/system/closr.service > /dev/null <<'EOF'
            [Unit]
            Description=CLOSR Backend
            After=network.target

            [Service]
            User=ubuntu
            WorkingDirectory=/home/ubuntu
            # 시크릿은 저장소에 두지 않고 EC2 의 .env 에서 읽습니다.
            # 파일이 없으면 prod 프로필의 DB_URL 이 비어 기동에 실패하고,
            # 아래 재실행 스텝의 상태 확인에서 배포가 빨간불로 끝납니다.
            EnvironmentFile=-/home/ubuntu/.env
            Environment=SPRING_PROFILES_ACTIVE=prod
            ExecStart=/usr/bin/java -jar /home/ubuntu/app.jar
            SuccessExitStatus=143
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            EOF
            sudo systemctl daemon-reload
            sudo systemctl enable closr

            # systemd 전환 이전 nohup 으로 띄운 프로세스가 남아 있으면 정리합니다.
            #
            # 이 스크립트는 본문이 SSH 세션의 커맨드라인에 통째로 실려 실행됩니다.
            # 그래서 pgrep -f 로 커맨드라인을 훑으면 스크립트에 적힌 패턴 문자열
            # 때문에 스크립트를 실행 중인 셸 자신이 잡히고, 그 PID 를 kill 하면
            # SSH 세션이 끊겨 배포가 exit 143 으로 실패합니다. 실제로 그랬습니다.
            #
            # 그래서 커맨드라인 패턴 대신 프로세스 이름이 정확히 java 인 것만
            # 추린 뒤, 그중 예전 jar 를 쓰는 것만 골라 종료합니다.
            # 셸 · sshd 는 이름이 java 가 아니라 원천적으로 걸리지 않고,
            # systemd 가 띄우는 프로세스는 app.jar 라 여기에 해당하지 않습니다.
            #
            # nohup 방식에서 넘어오기 위한 일회성 정리입니다.
            # 배포가 한 번 성공하고 나면 이 블록은 지워도 됩니다.
            old_nohup_pids() {
                for PID in $(pgrep -x java 2>/dev/null || true); do
                    case "$(ps -o args= -p "$PID" 2>/dev/null)" in
                        *closr-*.jar*) echo "$PID" ;;
                    esac
                done
            }

            OLD_PIDS=$(old_nohup_pids)
            if [ -n "$OLD_PIDS" ]; then
                echo "이전 nohup 프로세스 종료 (PID: $(echo $OLD_PIDS | tr '\n' ' '))"
                kill $OLD_PIDS 2>/dev/null || true
                sleep 5

                REMAINING=$(old_nohup_pids)
                if [ -n "$REMAINING" ]; then
                    echo "종료되지 않아 강제 종료합니다 (PID: $(echo $REMAINING | tr '\n' ' '))"
                    kill -9 $REMAINING 2>/dev/null || true
                fi
            else
                echo "정리할 이전 nohup 프로세스가 없습니다"
            fi

      - name: EC2에서 애플리케이션 재실행
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            # 버전이 올라가도 배포가 깨지지 않도록 파일명을 고정합니다.
            # Spring Boot는 실행 불가능한 -plain.jar도 함께 만들기 때문에 제외합니다.
            JAR=$(ls -t ~/deploy/*.jar 2>/dev/null | grep -v -- '-plain\.jar$' | head -n 1 || true)
            if [ -z "$JAR" ]; then
                echo "배포할 JAR 파일을 찾지 못했습니다."
                exit 1
            fi
            echo "배포 대상: $JAR"

            mv -f "$JAR" /home/ubuntu/app.jar
            rm -f ~/deploy/*.jar

            # 기동을 확인할 수단이 없으면 성공으로 처리하지 않습니다.
            if ! command -v curl > /dev/null 2>&1; then
                echo "curl 이 없어 기동을 확인할 수 없습니다. (sudo apt-get install -y curl)"
                exit 1
            fi

            # 재시작 횟수를 0 부터 세기 위해 이전 실패 상태를 지웁니다.
            sudo systemctl reset-failed closr 2>/dev/null || true
            sudo systemctl restart closr

            # 유닛에 Type= 이 없어 기본값 Type=simple 입니다. systemd 는 프로세스를
            # exec 한 순간 active 로 표시하는데, Spring Boot 가 실제로 뜨는 데는
            # 10~20초가 걸립니다. 그래서 is-active 는 "JVM 이 실행됐다" 이상을
            # 보증하지 못하고, Restart=always 때문에 크래시 루프 중에도 계속
            # active 로 보입니다. 실제로 HTTP 응답이 오는지로 판정합니다.
            HEALTH_URL="http://127.0.0.1:8080/api-docs"
            TIMEOUT=90
            DEADLINE=$(( $(date +%s) + TIMEOUT ))
            CODE=000

            echo "기동 확인 중 (최대 ${TIMEOUT}초): $HEALTH_URL"
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                # 연결 실패 시에도 curl 이 -w 로 000 을 출력합니다.
                CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$HEALTH_URL" || true)
                [ -z "$CODE" ] && CODE=000
                if [ "$CODE" = "200" ]; then
                    break
                fi

                # 크래시 루프라면 타임아웃까지 기다릴 이유가 없습니다.
                RESTARTS=$(systemctl show closr -p NRestarts --value 2>/dev/null || echo 0)
                if [ "${RESTARTS:-0}" -ge 3 ]; then
                    echo "재시작이 반복되고 있습니다 (NRestarts=$RESTARTS). 기동 실패로 판단합니다."
                    break
                fi

                sleep 3
            done

            if [ "$CODE" != "200" ]; then
                echo "기동 확인 실패: 마지막 응답 코드 $CODE"
                sudo systemctl status closr --no-pager || true
                sudo journalctl -u closr -n 50 --no-pager
                exit 1
            fi

            echo "기동 확인 완료 (HTTP $CODE)"
            echo "새로운 버전 배포 완료"

      - name: PR에 빌드 완료 댓글 남기기
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🛠️ **CI 빌드가 완료되었습니다!** (PR에서는 배포하지 않습니다)\n\n| Item | Status |\n|---|---|\n| **Result** | ✅ Success |\n| **Triggered By** | @' + context.actor + ' |'
            })
