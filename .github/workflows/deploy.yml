name: Deploy Spring Boot to AWS EC2

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

# PR에 댓글을 남기기 위한 깃허브 보트 권한 설정
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드 (테스트 제외)
        run: ./gradlew build -x test

      # 아래 배포 스텝들은 develop에 실제로 머지된 코드(push)에서만 실행됩니다.
      # PR에서는 위의 빌드까지만 수행합니다.
      - name: JAR 파일 EC2로 전송
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*.jar"
          target: "~/deploy"
          strip_components: 2

      - name: systemd 서비스 유닛 등록
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo tee /etc/systemd/system/closr.service > /dev/null <<'EOF'
            [Unit]
            Description=CLOSR Backend
            After=network.target

            [Service]
            User=ubuntu
            WorkingDirectory=/home/ubuntu
            ExecStart=/usr/bin/java -jar /home/ubuntu/app.jar
            SuccessExitStatus=143
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            EOF
            sudo systemctl daemon-reload
            sudo systemctl enable closr

            # systemd 전환 이전 nohup으로 띄운 프로세스가 남아 있으면 정리합니다.
            # systemd가 띄우는 프로세스는 app.jar이므로 영향을 받지 않습니다.
            OLD_PID=$(pgrep -f 'java -jar .*closr-.*\.jar' || true)
            if [ -n "$OLD_PID" ]; then
                echo "이전 nohup 프로세스 종료 (PID: $OLD_PID)"
                kill $OLD_PID
                sleep 3
            fi

      - name: EC2에서 애플리케이션 재실행
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            # 버전이 올라가도 배포가 깨지지 않도록 파일명을 고정합니다.
            # Spring Boot는 실행 불가능한 -plain.jar도 함께 만들기 때문에 제외합니다.
            JAR=$(ls -t ~/deploy/*.jar 2>/dev/null | grep -v -- '-plain\.jar$' | head -n 1 || true)
            if [ -z "$JAR" ]; then
                echo "배포할 JAR 파일을 찾지 못했습니다."
                exit 1
            fi
            echo "배포 대상: $JAR"

            mv -f "$JAR" /home/ubuntu/app.jar
            rm -f ~/deploy/*.jar

            sudo systemctl restart closr
            sleep 5
            if ! sudo systemctl is-active --quiet closr; then
                echo "서비스 기동에 실패했습니다."
                sudo journalctl -u closr -n 50 --no-pager
                exit 1
            fi
            echo "새로운 버전 배포 완료"

      - name: PR에 빌드 완료 댓글 남기기
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🛠️ **CI 빌드가 완료되었습니다!** (PR에서는 배포하지 않습니다)\n\n| Item | Status |\n|---|---|\n| **Result** | ✅ Success |\n| **Triggered By** | @' + context.actor + ' |'
            })
