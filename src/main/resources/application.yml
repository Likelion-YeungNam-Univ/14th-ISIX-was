spring:
  application:
    name: closr

  profiles:
    active: local

  datasource:
    url: ${DB_URL:jdbc:h2:mem:closr}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs

cors:
  origins: ${CORS_ORIGINS:http://localhost:5173}

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}
    # 아바타 생성은 비동기(폴링)라 개별 호출은 모두 짧습니다.
    #   POST /api/avatar/generate -> 202 즉시 반환
    #   GET  /api/avatar/{id}     -> 상태만 조회
    # 다만 사진 업로드가 최대 10MB 이고 AI 서버가 무거운 파이썬 프로세스라
    # 기본값보다는 여유를 둡니다.
    timeout: ${AI_SERVER_TIMEOUT:30000}

jwt:
  secret: ${JWT_SECRET:local-development-secret-key-change-me-in-production}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

logging:
  level:
    com.closr: DEBUG
