spring:
  application:
    name: closr

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:h2:mem:closr}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # 콘솔은 인증이 없어 열려 있으면 누구나 임의 SQL 을 실행할 수 있습니다.
  # 기본은 꺼두고 local 프로필에서만 켭니다.
  h2:
    console:
      enabled: false
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs

cors:
  origins: ${CORS_ORIGINS:http://localhost:5173}

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}
    # 아바타 생성은 비동기(폴링)라 개별 호출은 모두 짧습니다.
    #   POST /api/avatar/generate -> 202 즉시 반환
    #   GET  /api/avatar/{id}     -> 상태만 조회
    # 다만 사진 업로드가 최대 10MB 이고 AI 서버가 무거운 파이썬 프로세스라
    # 기본값보다는 여유를 둡니다.
    timeout: ${AI_SERVER_TIMEOUT:30000}

jwt:
  # 기본값을 두지 않습니다. 저장소에 적힌 시크릿으로 서명하면 누구나 토큰을 위조할 수 있습니다.
  # 로컬 개발용 기본값은 아래 local 프로필 문서에 있습니다.
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

logging:
  level:
    com.closr: DEBUG

---
# 로컬 개발 프로필.
# application-local.yml 은 .gitignore 대상이라 새로 받은 사람에게는 없습니다.
# 별도 설정 없이 bootRun 이 되도록 개발 편의 설정은 여기에 둡니다.
spring:
  config:
    activate:
      on-profile: local

  h2:
    console:
      enabled: true

jwt:
  secret: ${JWT_SECRET:local-only-dev-secret-never-used-outside-local-profile}
